<svg width="480" height="420" viewBox="0 0 480 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Map Shape Gradient -->
    <linearGradient id="ne-mesh-gradient" x1="60" y1="40" x2="420" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="45%" stop-color="#7C3AED" />
      <stop offset="85%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Outer Soft Glow Shadow -->
    <filter id="ne-mesh-glow" x="0" y="0" width="480" height="420" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#7C3AED" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Glowing Map Polygon Mesh -->
  <g filter="url(#ne-mesh-glow)">
    <!-- Base Polygon Body -->
    <path
      d="M140 70 L210 40 L275 80 L345 35 L405 95 L395 160 L445 195 L410 260 L435 320 L370 345 L360 400 L280 390 L240 435 L165 405 L100 425 L50 370 L80 300 L30 250 L65 190 L50 120 Z"
      fill="url(#ne-mesh-gradient)"
    />

    <!-- Internal Facet Triangles / Polygons for 3D Gem Depth -->
    <path
      d="M140 70 L210 135 L275 80 L345 145 L405 95 L330 205 L445 195 L370 255 L435 320 L330 330 L360 400 L260 330 L240 435 L180 340 L100 425 L120 320 L50 370 L105 255 L30 250 L115 190 L50 120 L140 145 Z"
      fill="white"
      fill-opacity="0.12"
      stroke="white"
      stroke-opacity="0.25"
      stroke-width="1.5"
      stroke-linejoin="round"
    />
  </g>

  <!-- Interconnecting Dashed Network Path -->
  <path
    d="M140 145 L210 135 L275 180 L330 205 L370 255 L260 330 L180 340 L120 320 L105 255 Z"
    stroke="white"
    stroke-opacity="0.75"
    stroke-width="2"
    stroke-dasharray="4 6"
    stroke-linecap="round"
  />

  <path
    d="M210 135 L370 255 M275 180 L180 340 M140 145 L330 205"
    stroke="white"
    stroke-opacity="0.4"
    stroke-width="1.5"
    stroke-dasharray="3 5"
  />

  <!-- Active Node Dots -->
  <g fill="white">
    <circle cx="140" cy="145" r="7" filter="drop-shadow(0 0 6px rgba(255,255,255,0.9))" />
    <circle cx="210" cy="135" r="7" filter="drop-shadow(0 0 6px rgba(255,255,255,0.9))" />
    <circle cx="275" cy="180" r="8" filter="drop-shadow(0 0 8px rgba(255,255,255,1))" />
    <circle cx="330" cy="205" r="7" filter="drop-shadow(0 0 6px rgba(255,255,255,0.9))" />
    <circle cx="370" cy="255" r="8" filter="drop-shadow(0 0 8px rgba(255,255,255,1))" />
    <circle cx="260" cy="330" r="7" filter="drop-shadow(0 0 6px rgba(255,255,255,0.9))" />
    <circle cx="180" cy="340" r="7" filter="drop-shadow(0 0 6px rgba(255,255,255,0.9))" />
    <circle cx="120" cy="320" r="6" filter="drop-shadow(0 0 6px rgba(255,255,255,0.9))" />
    <circle cx="105" cy="255" r="6" filter="drop-shadow(0 0 6px rgba(255,255,255,0.9))" />
  </g>
</svg>
